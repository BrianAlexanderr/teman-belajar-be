# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        ports:
          - 6379:6379

    env:
      SPRING_DATASOURCE_URL: ${{secrets.SUPABASE_URL}}
      SECRET_KEY: ${{secrets.JWT_SECRET}}
      OTP_PREFIX: ${{secrets.OTP_PREFIX}}
      MAIL_USERNAME: ${{secrets.MAIL_USERNAME}}
      MAIL_PASSWORD: ${{secrets.MAIL_PASSWORD}}
      SPRING_REDIS_HOST: localhost
      SPRING_REDIS_PORT: 6379
      SUPABASE_S3_ENDPOINT: ${{secrets.SUPABASE_S3_ENDPOINT}}
      SUPABASE_ACCESS_KEY: ${{secrets.SUPABASE_ACCESS_KEY}}
      SUPABASE_SECRET_KEY: ${{secrets.SUPABASE_SECRET_KEY}}
      SUPABASE_S3_REGION: ${{secrets.SUPABASE_REGION}}
      SUPABASE_BUCKET_NAME: ${{secrets.SUPABASE_BUCKET_NAME}}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and Test with Maven
      run: mvn clean verify -Dspring.profiles.active=test
